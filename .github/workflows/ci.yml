# Continuous integration. See docs/operaciones/integracion-continua.md.
#
# `ci-ok` is the only required check on `main`: it always runs and fails when any job it
# depends on failed or was cancelled. Jobs skipped by the path filter do not block it, so a
# pull request that only touches the frontend does not wait for the backend.
#
# Every action is pinned by commit hash, with its version in a comment. Dependabot updates
# both. Tool images run with `docker run` are pinned by tag and digest; Dependabot does not
# see them, so they are updated by hand (see the document above).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The whole history is scanned on every run: it takes seconds and also catches a secret
      # added and removed again inside the same pull request.
      - name: Scan the history with gitleaks
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" "$GITLEAKS_IMAGE" git /repo --redact --no-banner --exit-code 1

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Compiles, runs unit and Testcontainers integration tests, and checks the format.
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level high
      - name: Check format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test --watch=false
      # Production build. The URLs are reserved `.test` domains: the build only needs valid
      # https values, and no real domain is written in the repository (ADR 0006).
      - name: Build
        run: pnpm build
        env:
          DENTASOFT_URLS_API: https://api.dentasoft.test
          DENTASOFT_URLS_AUTH: https://auth.dentasoft.test

  # Pester tests of scripts/. They run on Windows PowerShell 5.1, as the scripts do locally,
  # and with Pester 3.4.0, the version Windows ships and the one the tests' syntax targets.
  # The runner image may also have a newer Pester, which `Invoke-Pester` would load by
  # default, so the version is imported explicitly.
  scripts:
    name: scripts
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: |
          $ErrorActionPreference = 'Stop'
          "Windows PowerShell $($PSVersionTable.PSVersion)"
          $version = $PSVersionTable.PSVersion
          if ($version.Major -ne 5 -or $version.Minor -ne 1) { throw 'Windows PowerShell 5.1 is required.' }
          Import-Module Pester -RequiredVersion 3.4.0
          $result = Invoke-Pester -Path scripts -PassThru
          if ($result.TotalCount -eq 0) { throw 'No Pester tests were found in scripts/.' }
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) Pester test(s) failed." }

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, secrets, backend, frontend, scripts, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail when a required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "At least one job failed or was cancelled."
          exit 1
      - run: echo "All required jobs passed or were skipped by the path filter."

  # Runs when the backend changed. Pull requests build and scan the image, so a broken base
  # image (for example a Dependabot digest update) fails before the merge. Only a push to main
  # publishes it, tagged with the commit hash: tags are never reused, so a deployment always
  # knows which code it runs.
  # `packages: write` also applies on pull requests: GitHub makes the token read-only for
  # pull requests from forks and Dependabot, and same-repository branches come from people
  # who can already push.
  image:
    name: image
    needs: [changes, backend]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dentasoft-backend:${GITHUB_SHA}"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${image}" backend
      # Same policy as backend/README.md: critical vulnerabilities stop the release; high ones
      # are listed for review. Temporary exceptions go in backend/.trivyignore.
      - name: Scan the image with Trivy
        run: |
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-cache:/root/.cache/trivy \
              -v "$GITHUB_WORKSPACE/backend/.trivyignore:/.trivyignore:ro" \
              "$TRIVY_IMAGE" "$@"
          }
          # The databases are downloaded once, retrying a transient registry failure, and
          # both scans reuse them.
          for attempt in 1 2 3; do
            if trivy image --download-db-only --no-progress \
              && trivy image --download-java-db-only --no-progress; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done
          scan=(image --skip-db-update --skip-java-db-update --ignorefile /.trivyignore --scanners vuln)
          trivy "${scan[@]}" --severity HIGH,CRITICAL --no-progress "$IMAGE"
          trivy "${scan[@]}" --severity CRITICAL --exit-code 1 --quiet "$IMAGE"
      - name: Push to GHCR
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker logout ghcr.io
