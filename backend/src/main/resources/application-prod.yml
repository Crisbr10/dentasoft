# Production. These already default to off in application.yml; they are repeated here so the production
# values are visible in one place. A profile activated after prod, or an environment variable, can still
# override them: do not activate other profiles together with prod.
management:
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
