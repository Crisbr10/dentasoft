# Local development (activated by `mvnw spring-boot:run` or SPRING_PROFILES_ACTIVE=local).
dentasoft:
  urls:
    app: http://localhost:4200
    api: http://localhost:8080
    auth: http://localhost:8180
  rate-limit:
    # Not a secret: it only hashes the IPs of the local Redis. Real environments must set their own.
    key: ${DENTASOFT_RATE_LIMIT_KEY:local-development-only-not-a-secret}

spring:
  # The PostgreSQL of infra/ (compose.yml), with the same password variables as infra/.env.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dentasoft}
    username: ${SPRING_DATASOURCE_USERNAME:dentasoft_app}
    password: ${SPRING_DATASOURCE_PASSWORD:${DENTASOFT_DB_APP_PASSWORD:}}
  flyway:
    user: ${SPRING_FLYWAY_USER:dentasoft_owner}
    password: ${SPRING_FLYWAY_PASSWORD:${DENTASOFT_DB_OWNER_PASSWORD:}}
  data:
    redis:
      # Same variable as infra/.env, so `mvnw spring-boot:run` reaches the local Redis.
      password: ${DENTASOFT_REDIS_PASSWORD:}

# Readable text instead of JSON, with the request ID in brackets.
logging:
  structured:
    format:
      console: ${DENTASOFT_LOG_FORMAT:}
  pattern:
    correlation: "[%X{requestId:-}] "

management:
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
