# Base configuration. No secrets here: every environment-specific value comes
# from an environment variable, with a default that only suits local development.
spring:
  application:
    name: dentasoft
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  messages:
    basename: messages
    fallback-to-system-locale: false
  web:
    locale: es
  # Two database roles (ADR 0002, infra/postgres/init/01-init.sh). The application connects as dentasoft_app
  # (NOBYPASSRLS, owns nothing): SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
  # Flyway migrates as dentasoft_owner with its own credentials: SPRING_FLYWAY_USER, SPRING_FLYWAY_PASSWORD.
  # Without them Flyway would use dentasoft_app, which cannot create tables, so startup fails instead of
  # running with the wrong role.
  datasource:
    hikari:
      data-source-properties:
        # The driver leaves the server's detail out of exception messages: it repeats the row's values, such as the
        # key of a unique constraint, and messages reach logs. Code reads the error's fields from
        # PSQLException.getServerErrorMessage(), which keeps them (#123). The platform pool sets it too.
        logServerErrorDetail: false
  flyway:
    # Never let `flyway clean` (drop every object) run against a real database.
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      # The schema belongs to Flyway; Hibernate never changes it.
      ddl-auto: none
  data:
    redis:
      # Short timeouts: if Redis stalls, rate limiting falls back to the per-instance limit quickly
      # instead of holding requests. Host, port and password: SPRING_DATA_REDIS_HOST, _PORT, _PASSWORD.
      timeout: 1s
      connect-timeout: 1s
      # Redis holds rate-limit buckets (and later queues), not Spring Data repositories.
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # The client IP is resolved only by ClientIpResolver, which trusts forwarding headers just from
  # DENTASOFT_TRUSTED_PROXIES. `none` stops Spring Boot from enabling Tomcat's RemoteIpValve on its own
  # (it does so automatically on Kubernetes), which would rewrite the remote address beforehand.
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  tomcat:
    # Form posts are parsed by Tomcat itself; JSON bodies are limited by dentasoft.http.max-request-body-size.
    max-http-form-post-size: ${dentasoft.http.max-request-body-size}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  health:
    # Redis only holds the rate limits, which fall back to a per-instance limit when it is down
    # (metric dentasoft.rate.limit.redis.available), so a Redis outage must not turn health DOWN.
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Public URLs (dentasoft.urls.app, .api, .auth) have no default here: outside the local
# profile they come from DENTASOFT_URLS_APP, DENTASOFT_URLS_API and DENTASOFT_URLS_AUTH.
dentasoft:
  # Connection of the platform administration module as dentasoft_platform (ADR 0011). Required: the application
  # does not start without the username and password. Same database as the application unless told otherwise.
  platform:
    datasource:
      url: ${DENTASOFT_PLATFORM_DATASOURCE_URL:${spring.datasource.url:}}
      username: ${DENTASOFT_PLATFORM_DATASOURCE_USERNAME:}
      password: ${DENTASOFT_PLATFORM_DATASOURCE_PASSWORD:}
  cors:
    allowed-origins: ${DENTASOFT_CORS_ALLOWED_ORIGINS:${dentasoft.urls.app:}}
  http:
    max-request-body-size: ${DENTASOFT_HTTP_MAX_REQUEST_BODY_SIZE:1MB}
    # Proxies allowed to set X-Forwarded-For and CF-Connecting-IP. Empty: the connection address is used.
    trusted-proxies: ${DENTASOFT_TRUSTED_PROXIES:}
  rate-limit:
    enabled: ${DENTASOFT_RATE_LIMIT_ENABLED:true}
    anonymous-per-minute: ${DENTASOFT_RATE_LIMIT_ANONYMOUS_PER_MINUTE:120}
    user-per-minute: ${DENTASOFT_RATE_LIMIT_USER_PER_MINUTE:600}
    # Secret for the HMAC of IPs and user IDs in Redis keys. No default: required outside local.
    key: ${DENTASOFT_RATE_LIMIT_KEY:}

# One JSON object per line (Elastic Common Schema), with the request ID from the MDC.
# Never log personal or clinical data: use identifiers.
logging:
  structured:
    format:
      console: ${DENTASOFT_LOG_FORMAT:ecs}
  level:
    # Hibernate logs the server's message of every failed statement at WARN, and it may quote a value (#123). The
    # exception still reaches the caller; one nobody handles is logged without messages (RedactedException).
    # SqlLoggingConfigurationTests keeps this and the loggers that write SQL or its parameters quiet.
    org.hibernate.orm.jdbc.error: error

# OpenAPI and Swagger UI are off unless a non-production profile turns them on.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
