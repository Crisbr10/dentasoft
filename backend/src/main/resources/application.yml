# Base configuration. No secrets here: every environment-specific value comes
# from an environment variable, with a default that only suits local development.
spring:
  application:
    name: dentasoft
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  messages:
    basename: messages
    fallback-to-system-locale: false
  web:
    locale: es

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# OpenAPI and Swagger UI are off unless a non-production profile turns them on.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
