<h1 class="home__title">{{ 'home.title' | transloco }}</h1>

<mat-card appearance="outlined" class="home__health">
  <mat-card-header>
    <mat-card-title>{{ 'home.health.title' | transloco }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p class="home__status" [attr.data-status]="status()" role="status">
      @switch (status()) {
        @case ('checking') {
          <!-- The text next to it already says what is happening. -->
          <mat-spinner diameter="20" aria-hidden="true" />
        }
        @case ('up') {
          <mat-icon svgIcon="check-circle" />
        }
        @default {
          <mat-icon svgIcon="error" />
        }
      }
      <span>{{ statusKey() | transloco }}</span>
    </p>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button type="button" [disabled]="status() === 'checking'" (click)="retry()">
      <mat-icon svgIcon="refresh" />
      {{ 'home.health.retry' | transloco }}
    </button>
  </mat-card-actions>
</mat-card>
