# Local development. Ports are published on 127.0.0.1 only, never on the network.
#   docker compose -f compose.yml -f compose.local.yml up -d --wait
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  keycloak:
    command: ["start-dev", "--import-realm"]
    environment:
      DENTASOFT_KC_LOCAL_USERS_PASSWORD: ${DENTASOFT_KC_LOCAL_USERS_PASSWORD:?set DENTASOFT_KC_LOCAL_USERS_PASSWORD in .env}
    volumes:
      # Invented test users (README.md). Local only: never mount this file in other environments.
      - ./keycloak/local/dentasoft-users-0.json:/opt/keycloak/data/import/dentasoft-users-0.json:ro
    ports:
      - "127.0.0.1:8180:8080"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  seaweedfs:
    ports:
      - "127.0.0.1:8333:8333"

  # Catches every outgoing email in local. Other environments send through Resend.
  mailpit:
    image: ${MAILPIT_IMAGE:?set MAILPIT_IMAGE in .env}
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 64m
    restart: unless-stopped

  clamav:
    ports:
      - "127.0.0.1:3310:3310"

  # The backend in a container, built from the local code. Optional: it uses port 8080, like
  # `mvnw spring-boot:run`, so run only one of them.
  #   docker compose -f compose.yml -f compose.local.yml --profile app up -d --wait --build
  # Other environments run the image published to GHCR (M00-T07), not a local build.
  app:
    profiles: ["app"]
    build:
      context: ../backend
    image: dentasoft-backend:local
    environment:
      SPRING_PROFILES_ACTIVE: local
      # Graceful shutdown timeout: keep it below stop_grace_period.
      SHUTDOWN_TIMEOUT: 30s
      # Public URLs: what the browser sees, so localhost even inside Docker.
      DENTASOFT_URLS_APP: http://localhost:4200
      DENTASOFT_URLS_API: http://localhost:8080
      DENTASOFT_URLS_AUTH: http://localhost:8180
      # Backing services, reached by their service name inside the Docker network.
      # Prepared for the tasks that add them (database M01-T01, Redis M00-T08, S3 M05,
      # email M07): those tasks may rename these variables when they wire them up.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dentasoft
      SPRING_DATASOURCE_USERNAME: dentasoft_app
      SPRING_DATASOURCE_PASSWORD: ${DENTASOFT_DB_APP_PASSWORD:?set DENTASOFT_DB_APP_PASSWORD in .env}
      SPRING_FLYWAY_USER: dentasoft_owner
      SPRING_FLYWAY_PASSWORD: ${DENTASOFT_DB_OWNER_PASSWORD:?set DENTASOFT_DB_OWNER_PASSWORD in .env}
      DENTASOFT_PLATFORM_DATASOURCE_USERNAME: dentasoft_platform
      DENTASOFT_PLATFORM_DATASOURCE_PASSWORD: ${DENTASOFT_DB_PLATFORM_PASSWORD:?set DENTASOFT_DB_PLATFORM_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${DENTASOFT_REDIS_PASSWORD:?set DENTASOFT_REDIS_PASSWORD in .env}
      DENTASOFT_S3_ENDPOINT: http://seaweedfs:8333
      DENTASOFT_S3_REGION: ${DENTASOFT_S3_REGION:?set DENTASOFT_S3_REGION in .env}
      DENTASOFT_S3_BUCKET: ${DENTASOFT_S3_BUCKET:?set DENTASOFT_S3_BUCKET in .env}
      DENTASOFT_S3_ACCESS_KEY: ${DENTASOFT_S3_ACCESS_KEY:?set DENTASOFT_S3_ACCESS_KEY in .env}
      DENTASOFT_S3_SECRET_KEY: ${DENTASOFT_S3_SECRET_KEY:?set DENTASOFT_S3_SECRET_KEY in .env}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      # Tokens carry the public URL (DENTASOFT_URLS_AUTH) as issuer, but from inside Docker
      # Keycloak's signing keys are at http://keycloak:8080 (M02-T02).
      DENTASOFT_AUTH_JWK_SET_URI: http://keycloak:8080/realms/dentasoft/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-init:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    # Nothing writes to the image: only /tmp (JVM temporary files) is writable.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Longer than SHUTDOWN_TIMEOUT (above) so Docker does not kill the JVM while it is still
    # finishing requests. If you raise one, raise the other.
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          # With -XX:MaxRAMPercentage=75 (Dockerfile) the heap gets about 576 MB; the rest is
          # for metaspace, thread stacks and the 64 MB /tmp tmpfs, which also counts here.
          memory: 768m
    restart: unless-stopped
